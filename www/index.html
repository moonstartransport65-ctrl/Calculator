<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Worksheet Calculator</title>
<style>
:root{
  --bg:#e9f0ee; --bar:#f3f7f6; --line:#c9d6d3; --ink:#1f3a40; --red:#b9432c;
  --num:#e3eaea; --op:#c6dfdc; --fn:#5d8089; --ac:#d9822b; --mute:#d2dddc;
  --mono:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:2px 10px;background:var(--bar);border-bottom:1px solid var(--line)}
header h1{flex:1;font-size:20px;font-weight:500;margin:0 0 0 8px}
.ib{border:0;background:none;font-size:21px;color:var(--ink);width:38px;height:38px;border-radius:50%}
.ib:active{background:var(--mute)}
#tape{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 4px}
.row{display:flex;flex:none;width:min(68%,320px);font-family:var(--mono);font-size:21px;line-height:1.4}
.row .s{width:30px;flex:none}
.row .v{flex:1;text-align:right;white-space:nowrap}
.row.neg{color:var(--red)}
.row.c .v{font-weight:700}
.rule{width:min(68%,320px);border-top:1px solid var(--ink);margin:6px 0 8px}
.rule.d{border-top:4px double var(--ink);margin:6px 0 8px}
.live .v{opacity:.95}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--ink);vertical-align:text-bottom;margin-left:2px;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
#bar{display:flex;align-items:center;gap:4px;padding:2px 12px;background:var(--bar);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tg{border:2px solid var(--c);background:var(--t);color:var(--c);font-weight:700;padding:6px 16px;margin-right:4px;border-radius:14px;font-size:16px}
#k1{--c:#1b7f8f;--t:rgba(27,127,143,.12)}
#abc{--c:#d2781e;--t:rgba(210,120,30,.14)}
.tg.on{background:var(--c);color:#fff;box-shadow:0 3px 6px rgba(31,58,64,.3)}
#kbd{display:flex;flex-direction:column;gap:6px;padding:6px 10px}
#kbd.hide{display:none}
.kr{display:flex;gap:5px}
#kbd button{flex:1;min-width:0;height:42px;border:0;border-radius:11px;padding:0;font-size:18px;color:var(--ink);background:var(--num);box-shadow:0 2px 3px rgba(31,58,64,.22)}
#kbd button:active{filter:brightness(.92)}
#kbd .wd{flex:1.5}
#kbd .spc{flex:4}
#kbd .fn{background:var(--fn);color:#fff}
#kbd .go{background:var(--ac);color:#fff}
#kbd .on{background:var(--ink);color:#fff}
#bar .sp{flex:1}
#disp{font-size:24px;font-weight:600;padding-right:6px}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 10px 6px}
#pad.hide{display:none}
#pad button{border:0;border-radius:13px;height:42px;font-size:20px;color:var(--ink);background:var(--num);box-shadow:0 2px 3px rgba(31,58,64,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
#pad button:active{filter:brightness(.92);transform:translateY(1px)}
#pad button small{font-size:9px;margin-top:1px}
#pad .op{background:var(--op)}
#pad .fn{background:var(--fn);color:#fff}
#pad .ac{background:var(--ac);color:#fff;font-weight:600}
#pad .mu{background:var(--op);font-size:16px}
#pad .off{opacity:.5}
#drawer{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(20,40,44,.45);display:none}
#drawer.open{display:block}
#panel{width:86%;height:100%;background:var(--bar);display:flex;flex-direction:column}
#panel h2{margin:0;padding:16px;font-size:19px;font-weight:600;border-bottom:1px solid var(--line)}
#hist{flex:1;overflow-y:auto}
.h{padding:12px 16px;border-bottom:1px solid var(--line)}
.h:active{background:var(--mute)}
.h .t{font-size:12px;color:var(--fn)}
.h .e{font-family:var(--mono);font-size:13px;color:#51666b;margin:3px 0;overflow-wrap:anywhere}
.h .r{font-family:var(--mono);font-size:20px;font-weight:700;text-align:right}
.empty{padding:24px 16px;color:var(--fn)}
#clr{margin:12px;padding:13px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-size:16px}
#ad{height:50px;margin:0 10px calc(6px + env(safe-area-inset-bottom,0px));border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--fn);font-size:12px;overflow:hidden;flex:none}
.gap{height:29px}
.rw{display:flex;align-items:flex-start}
.note{flex:1;min-width:0;min-height:29px;padding:4px 0 0 10px;font-size:14px;line-height:1.3;color:var(--fn);overflow-wrap:anywhere}
input.ni{width:100%;font:inherit;border:0;border-bottom:1px solid var(--fn);background:rgba(255,255,255,.7);color:var(--ink);outline:none;padding:0}
input.ed{width:100%;font:inherit;text-align:right;border:0;border-bottom:2px solid var(--ink);background:rgba(255,255,255,.7);color:inherit;outline:none;padding:0}
#toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ib" id="menu" aria-label="History">☰</button>
    <h1>Worksheet</h1>
    <button class="ib" id="kb" aria-label="Show or hide keypad">⌨</button>
    <button class="ib" id="un" aria-label="Undo">↶</button>
    <button class="ib" id="re" aria-label="Redo">↷</button>
  </header>
  <div id="tape"></div>
  <div id="bar">
    <button class="tg on" id="k1">K1</button><button class="tg" id="abc">ABC</button>
    <span class="sp"></span>
    <span id="disp">0.00</span>
    <button class="ib" id="cp" aria-label="Copy">⧉</button>
  </div>
  <div id="pad"></div>
  <div id="kbd" class="hide"></div>
  <!-- Banner ad slot (320x50). Paste your ad code inside this div. -->
  <div id="ad"><span>Ad space</span></div>
  <div id="drawer"><div id="panel">
    <h2>History</h2>
    <div id="hist"></div>
    <button id="clr">Clear history</button>
  </div></div>
  <div id="toast"></div>
</div>

<script>
window.onerror = function (m, u, l) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;background:#b9432c;color:#fff;padding:10px;font:14px sans-serif';
  d.textContent = 'Error: ' + m + ' (line ' + l + ') ';
  var b = document.createElement('button'); b.textContent = 'Reset data';
  b.onclick = function () { try { localStorage.removeItem('ws_state'); localStorage.removeItem('ws_hist'); } catch (e) {} location.reload(); };
  d.appendChild(b); document.body.appendChild(d);
};
const $ = id => document.getElementById(id);
let S = {tape:[], buf:'', op:'+', mem:0}, H = [], U = [], R = [];

try {
  const a = JSON.parse(localStorage.getItem('ws_state') || 'null'); if (a) S = a;
  const b = JSON.parse(localStorage.getItem('ws_hist') || 'null'); if (b) H = b;
} catch (e) {}
if (!S || !Array.isArray(S.tape)) S = {tape: [], buf: '', op: '+', mem: 0};
if (!Array.isArray(H)) H = [];
function save() {
  try { localStorage.setItem('ws_state', JSON.stringify(S)); localStorage.setItem('ws_hist', JSON.stringify(H)); } catch (e) {}
}

const esc = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function raw(v) {
  const d = (String(v).split('.')[1] || '').length;
  return v.toFixed(Math.max(2, Math.min(6, d)));
}
const rnd = n => Math.round(n * 1e8) / 1e8;
const fmt = n => n.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 6});
function fmtBuf(b) {
  const neg = b[0] === '-'; if (neg) b = b.slice(1);
  const [i, d] = b.split('.');
  let s = Number(i || 0).toLocaleString('en-IN');
  if (b.includes('.')) s += '.' + d;
  return (neg ? '-' : '') + s;
}
function group() {
  let i = S.tape.length - 1;
  while (i >= 0 && S.tape[i].t !== 'rule' && S.tape[i].t !== 'gap') i--;
  return S.tape.slice(i + 1);
}
function calc(g) {
  let r = 0;
  for (const e of g) {
    if (e.v == null) continue;
    if (e.op === '+') r += e.v;
    else if (e.op === '-') r -= e.v;
    else if (e.op === '×') r *= e.v;
    else r = e.v === 0 ? NaN : r / e.v;
  }
  return rnd(r);
}
function cur() {
  if (S.buf !== '' && S.buf !== '-' && S.buf !== '.') return parseFloat(S.buf);
  const g = group(); return g.length ? calc(g) : 0;
}
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.k); toast.k = setTimeout(() => t.classList.remove('on'), 1400); }
function snap() { U.push(JSON.stringify(S)); if (U.length > 100) U.shift(); R = []; }
function entryOp() { return group().length === 0 ? '+' : S.op; }
function commit() {
  if (S.buf === '' || S.buf === '-' || S.buf === '.') { S.buf = ''; return; }
  S.tape.push({t: 'e', op: entryOp(), v: parseFloat(S.buf), n: S.ln || ''});
  S.buf = ''; S.ln = '';
}

function digit(d) {
  snap();
  if (d === '.') { if (S.buf.includes('.')) return; S.buf = (S.buf === '' ? '0' : S.buf) + '.'; }
  else if (S.buf === '0') S.buf = d;
  else if (S.buf.replace(/[-.]/g, '').length < 15) S.buf += d;
  render();
}
function oper(o) { snap(); commit(); S.op = o; render(); }
function equals() {
  if (S.buf !== '' && S.buf !== '.') {
    const g2 = group().concat([{op: entryOp(), v: parseFloat(S.buf)}]);
    if (!isFinite(calc(g2))) { toast('Cannot divide by zero'); return; }
  }
  snap(); commit();
  const g = group();
  if (g.length === 0 || (g.length === 1 && g[0].c)) {
    if (S.tape.length) { S.tape.push({t: 'gap'}); S.op = '+'; }
    return render();
  }
  const r = calc(g);
  if (!isFinite(r)) { toast('Cannot divide by zero'); return; }
  H.unshift({time: Date.now(), lines: g.map(e => e.op + ' ' + fmt(e.v) + (e.n ? ' (' + e.n + ')' : '')), total: r});
  if (H.length > 200) H.pop();
  S.tape.push({t: 'rule', d: g[g.length - 1].op === '-'});
  S.tape.push({t: 'e', op: '+', v: r, c: 1});
  S.op = '+';
  render();
}
function percent() {
  if (S.buf === '' || S.buf === '.') return;
  snap();
  let v = parseFloat(S.buf); const g = group();
  v = ((S.op === '+' || S.op === '-') && g.length) ? calc(g) * v / 100 : v / 100;
  S.buf = String(rnd(v)); render();
}
function back() {
  snap();
  if (S.buf !== '') S.buf = S.buf.slice(0, -1);
  else if (S.tape.length) {
    const x = S.tape[S.tape.length - 1];
    if (x.t === 'e' && !x.c && x.v != null) {
      /* take the last amount back and remove just one digit */
      S.tape.pop(); S.op = x.op; S.ln = x.n || ''; S.buf = raw(x.v).slice(0, -1);
    } else { S.tape.pop(); if (x.c) S.tape.pop(); }
  }
  render();
}
function clearAll() { snap(); S.tape = []; S.buf = ''; S.ln = ''; S.op = '+'; render(); }
function mem(k) {
  snap();
  if (k === 'M+') { S.mem = rnd(S.mem + cur()); toast('Added to memory'); }
  if (k === 'M-') { S.mem = rnd(S.mem - cur()); toast('Subtracted from memory'); }
  if (k === 'MC') { S.mem = 0; toast('Memory cleared'); }
  if (k === 'MR') { if (S.mem !== 0) S.buf = String(S.mem); }
  render();
}
function undo() { if (!U.length) return; R.push(JSON.stringify(S)); S = JSON.parse(U.pop()); clean(); render(); }
function redo() { if (!R.length) return; U.push(JSON.stringify(S)); S = JSON.parse(R.pop()); clean(); render(); }

const keys = [
  ['AC','ac',clearAll], ['⌫','fn',back], ['MR','mu',()=>mem('MR'),'mr'], ['00','op',()=>{digit('0');digit('0')}],
  ['M+','mu',()=>mem('M+'),'mp'], ['M−','mu',()=>mem('M-'),'mm'], ['MC','mu',()=>mem('MC')], ['÷','op',()=>oper('÷')],
  ['7','',()=>digit('7')], ['8','',()=>digit('8')], ['9','',()=>digit('9')], ['×','op',()=>oper('×')],
  ['4','',()=>digit('4')], ['5','',()=>digit('5')], ['6','',()=>digit('6')], ['−','op',()=>oper('-')],
  ['1','',()=>digit('1')], ['2','',()=>digit('2')], ['3','',()=>digit('3')], ['+','op',()=>oper('+')],
  ['0','',()=>digit('0')], ['.','',()=>digit('.')], ['%','op',percent], ['=','op',equals]
];
const pad = $('pad'), subs = {};
keys.forEach(k => {
  const b = document.createElement('button');
  if (k[1]) b.className = k[1];
  b.innerHTML = '<span>' + k[0] + '</span>' + (k[3] ? '<small></small>' : '');
  b.onclick = k[2];
  if (k[3]) subs[k[3]] = b;
  pad.appendChild(b);
});

function row(cls, op, text, extra) {
  const d = document.createElement('div');
  d.className = 'row ' + cls;
  const sym = op === '-' ? '−' : op;
  d.innerHTML = '<span class="s">' + sym + '</span><span class="v">' + text + (extra || '') + '</span>';
  return d;
}
let ABC = false, HIDE = false, SHIFT = false, NOTE = null;
function wrap(r, get, set) {
  const w = document.createElement('div'); w.className = 'rw'; w.appendChild(r);
  const n = document.createElement('div'); n.className = 'note'; n.textContent = get();
  n.onclick = () => editNote(n, get, set);
  w.appendChild(n); return w;
}
function editNote(el, get, set) {
  const inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'ni'; inp.placeholder = 'Title'; inp.value = get();
  inp.inputMode = ABC ? 'none' : 'text';
  el.textContent = ''; el.appendChild(inp); inp.focus();
  let done = false;
  const fin = ok => {
    if (done) return; done = true;
    if (NOTE && NOTE.inp === inp) NOTE = null;
    const tp = $('tape'), st = tp.scrollTop, v = inp.value.trim();
    if (ok && v !== get()) { snap(); set(v); }
    render(); tp.scrollTop = st;
  };
  NOTE = {inp, fin};
  inp.onblur = () => fin(true);
  inp.onkeydown = ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); fin(true); }
    else if (ev.key === 'Escape') { ev.preventDefault(); fin(false); }
  };
}
function render() {
  const tp = $('tape'); tp.innerHTML = '';
  S.tape.forEach((e, i) => {
    if (e.t === 'rule') { const r = document.createElement('div'); r.className = 'rule' + (e.d ? ' d' : ''); tp.appendChild(r); }
    else if (e.t === 'gap') { const g0 = document.createElement('div'); g0.className = 'gap'; tp.appendChild(g0); }
    else {
      const r0 = row((e.op === '-' ? 'neg ' : '') + (e.c ? 'c' : ''), e.op, e.v == null ? '' : fmt(e.v));
      r0.querySelector('.v').onclick = ev => {
        if (e.c) { toast('This is a total. Edit the amounts above it.'); return; }
        edit(i, ev.currentTarget);
      };
      tp.appendChild(wrap(r0, () => e.n || '', v => { e.n = v; }));
    }
  });
  const o = entryOp();
  tp.appendChild(wrap(row('live' + (o === '-' ? ' neg' : ''), o, S.buf === '' ? '' : fmtBuf(S.buf), '<i class="caret"></i>'), () => S.ln || '', v => { S.ln = v; }));
  tp.scrollTop = tp.scrollHeight;
  const c = cur();
  $('disp').textContent = S.buf !== '' && S.buf.includes('.') && !/\.\d{2}/.test(S.buf) ? fmtBuf(S.buf) : fmt(c);
  subs.mp.querySelector('small').textContent = '+' + fmt(c);
  subs.mm.querySelector('small').textContent = '−' + fmt(Math.abs(c));
  subs.mr.querySelector('small').textContent = S.mem ? fmt(S.mem) : '';
  subs.mr.classList.toggle('off', !S.mem);
  save();
}

/* Edit an amount already on the tape */
function fix() {
  let g = [], ok = true;
  for (let i = 0; i < S.tape.length; i++) {
    const e = S.tape[i];
    if (e.t === 'rule') {
      const r = calc(g); if (!isFinite(r)) ok = false;
      const nx = S.tape[i + 1]; if (nx) nx.v = isFinite(r) ? r : 0;
      g = [];
    } else if (e.t === 'gap') g = [];
    else g.push(e);
  }
  if (!isFinite(calc(g))) ok = false;
  return ok;
}
let ED = null;
function tidy() {
  let again = true;
  while (again) {
    again = false; let gs = 0;
    for (let i = 0; i < S.tape.length; i++) {
      if (S.tape[i].t === 'gap') { gs = i + 1; continue; }
      if (S.tape[i].t === 'rule') {
        if (S.tape.slice(gs, i).filter(e => !e.c).length === 0) {
          S.tape.splice(i, S.tape[i + 1] && S.tape[i + 1].c ? 2 : 1); again = true; break;
        }
        gs = i + 1;
      }
    }
  }
}
function clean() { S.tape = S.tape.filter(x => x.t === 'rule' || x.t === 'gap' || x.v != null); tidy(); }
function edBack() {
  if (!ED) return;
  if (ED.inp.value.length) ED.inp.value = ED.inp.value.slice(0, -1);
  else if (!ED.blank) { ED.blank = true; ED.sign.textContent = ''; }
  else ED.fin(true);
}
function edit(i, el) {
  if (ABC) { ABC = false; SHIFT = false; updateKb(); }
  const e = S.tape[i];
  const inp = document.createElement('input');
  inp.type = 'text'; inp.inputMode = 'none'; inp.className = 'ed'; inp.value = e.v == null ? '' : raw(e.v);
  const sign = el.parentNode.querySelector('.s');
  el.innerHTML = ''; el.appendChild(inp); inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (x) {}
  let done = false;
  const me = {inp, sign, e, blank: false};
  const fin = (ok, insOp) => {
    if (done) return; done = true; ED = null;
    const tp = $('tape'), st = tp.scrollTop, txt = inp.value.trim();
    let at = -1;
    if (ok) {
      if (txt === '') {
        if (e.v == null) { S.tape.splice(i, 1); tidy(); fix(); insOp = null; }
        else if (me.blank) { snap(); S.tape.splice(i, 1); tidy(); fix(); insOp = null; }
      } else {
        const n = parseFloat(txt.replace(/,/g, ''));
        if (isFinite(n) && n !== e.v) {
          snap(); const old = e.v; e.v = n;
          if (!fix()) { e.v = old; fix(); toast('Cannot divide by zero'); }
        }
      }
      if (insOp && S.tape[i] === e) {
        snap(); S.tape.splice(i + 1, 0, {t: 'e', op: insOp, v: null, n: ''}); at = i + 1;
      }
    }
    render(); tp.scrollTop = st;
    if (at >= 0) {
      const w = tp.children[at];
      if (w) { edit(at, w.querySelector('.v')); w.scrollIntoView({block: 'nearest'}); }
    }
  };
  me.fin = fin; ED = me;
  inp.onblur = () => fin(true);
  inp.onkeydown = ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); fin(true); }
    else if (ev.key === 'Escape') { ev.preventDefault(); fin(false); }
    else if (ev.key === 'Backspace' && inp.value === '') { ev.preventDefault(); edBack(); }
  };
}
/* While an amount is being edited, the keypad types into it */
['pointerdown', 'mousedown'].forEach(t => pad.addEventListener(t, ev => { if (ED) ev.preventDefault(); }));
const OPS = {'+': '+', '−': '-', '×': '×', '÷': '÷'};
pad.addEventListener('click', ev => {
  if (!ED) return;
  const b = ev.target.closest('button'); if (!b) return;
  ev.stopPropagation();
  const t = b.firstChild.textContent;
  if (/^[0-9]$/.test(t) || t === '00') ED.inp.value += t;
  else if (t === '.') { if (!ED.inp.value.includes('.')) ED.inp.value += '.'; }
  else if (t === '⌫') edBack();
  else if (t === '=') ED.fin(true);
  else if (t === 'AC') ED.fin(false);
  else if (OPS[t]) {
    const op = OPS[t];
    if (ED.e.v == null && ED.inp.value === '') {
      ED.e.op = op; ED.blank = false;
      ED.sign.textContent = op === '-' ? '−' : op;
      ED.sign.parentNode.classList.toggle('neg', op === '-');
    } else ED.fin(true, op);
  }
}, true);

/* History drawer */
function showHist() {
  const h = $('hist'); h.innerHTML = '';
  if (!H.length) h.innerHTML = '<div class="empty">No calculations yet. Press = to save one here.</div>';
  H.forEach(x => {
    const d = document.createElement('div'); d.className = 'h';
    const t = new Date(x.time).toLocaleString('en-IN', {day:'numeric', month:'short', hour:'numeric', minute:'2-digit'});
    d.innerHTML = '<div class="t">' + t + '</div><div class="e">' + esc(x.lines.join('  ')) + '</div><div class="r">= ' + fmt(x.total) + '</div>';
    d.onclick = () => { snap(); S.buf = String(x.total); $('drawer').classList.remove('open'); render(); };
    h.appendChild(d);
  });
  $('drawer').classList.add('open');
}
$('menu').onclick = showHist;
$('drawer').onclick = e => { if (e.target.id === 'drawer') $('drawer').classList.remove('open'); };
$('clr').onclick = () => { H = []; save(); showHist(); };
$('un').onclick = undo; $('re').onclick = redo;
$('kb').onclick = () => { HIDE = !HIDE; updateKb(); };
/* K1 = number keys, ABC = letter keyboard for titles */
const kbd = $('kbd'), ROWS = ['1234567890', 'qwertyuiop', 'asdfghjkl'];
function updateKb() {
  pad.classList.toggle('hide', HIDE || ABC);
  kbd.classList.toggle('hide', HIDE || !ABC);
  $('k1').classList.toggle('on', !ABC);
  $('abc').classList.toggle('on', ABC);
}
function relabel() {
  kbd.querySelectorAll('[data-l]').forEach(b => { b.textContent = SHIFT ? b.dataset.l.toUpperCase() : b.dataset.l; });
  const sh = kbd.querySelector('[data-k="shift"]'); if (sh) sh.classList.toggle('on', SHIFT);
}
function startNote() {
  const w = $('tape').lastElementChild, n = w && w.querySelector('.note');
  if (n) n.click();
}
function setABC(on) {
  if (!on && NOTE) NOTE.fin(true);
  ABC = on; SHIFT = false; HIDE = false; updateKb(); relabel();
  if (on) startNote();
}
function kkey(k, ch) {
  if (k === 'shift') { SHIFT = !SHIFT; relabel(); return; }
  if (k === 'k1') { setABC(false); return; }
  if (!NOTE) startNote();
  if (!NOTE) return;
  const i = NOTE.inp;
  if (k === 'bs') i.value = i.value.slice(0, -1);
  else if (k === 'sp') i.value += ' ';
  else if (k === 'go') { setABC(false); return; }
  else { i.value += SHIFT ? ch.toUpperCase() : ch; if (SHIFT) { SHIFT = false; relabel(); } }
  i.focus();
}
function krow(cls) { const d = document.createElement('div'); d.className = 'kr'; kbd.appendChild(d); return d; }
function kbtn(parent, label, k, cls, ch) {
  const b = document.createElement('button'); b.textContent = label;
  if (cls) b.className = cls;
  if (ch) b.dataset.l = ch;
  b.dataset.k = k;
  b.onclick = () => kkey(k, ch);
  parent.appendChild(b); return b;
}
ROWS.forEach(r => { const d = krow(); r.split('').forEach(c => kbtn(d, c, 'ch', '', c)); });
(function () {
  const d = krow();
  kbtn(d, '⇧', 'shift', 'fn wd');
  'zxcvbnm'.split('').forEach(c => kbtn(d, c, 'ch', '', c));
  kbtn(d, '⌫', 'bs', 'fn wd');
  const e = krow();
  kbtn(e, 'K1', 'k1', 'fn wd'); kbtn(e, 'space', 'sp', 'spc'); kbtn(e, '↵', 'go', 'go wd');
})();
['pointerdown', 'mousedown'].forEach(t => kbd.addEventListener(t, ev => ev.preventDefault()));
$('k1').onclick = () => { if (ABC) setABC(false); };
$('abc').onclick = () => { if (!ABC) setABC(true); };
$('cp').onclick = async () => {
  try { await navigator.clipboard.writeText(String(cur())); toast('Copied'); } catch (e) { toast('Copy not available'); }
};

/* Keyboard */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key;
  if (/^[0-9]$/.test(k)) digit(k);
  else if (k === '.') digit('.');
  else if (k === '+') oper('+');
  else if (k === '-') oper('-');
  else if (k === '*' || k === 'x') oper('×');
  else if (k === '/') { e.preventDefault(); oper('÷'); }
  else if (k === 'Enter' || k === '=') { e.preventDefault(); equals(); }
  else if (k === 'Backspace') back();
  else if (k === 'Escape') clearAll();
  else if (k === '%') percent();
});
clean();
render();
</script>
